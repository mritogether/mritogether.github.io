- date: 2026-11-24
  pinned: true
  title: Set up the hackathon environment
  body: |
    Every hands-on session runs in one environment on your own computer: JupyterLab with Python and Julia, and all the tools of the week. Please install it before the hackathon starts on 30 November, following the setup page:

    👉 [https://mcencini.github.io/mritogetherthon](https://mcencini.github.io/mritogetherthon)

    You need Docker and about 25 GB of free disk. If you have installed it already, it updates itself the next time you start it.

- date: 2026-11-22
  pinned: true
  title: Missing team assignment email
  body: |
    MRI TogetherThon 2026 participants: we've heard that some of you didn't receive your team assignment email, due to technical issues with our email server. We're sorry it didn't reach you.

    If you're missing yours, enter the email address you registered with in our team finder. You'll see your proposed team and instructions for confirming your participation.

    👉 [https://mritogether-team-finder.vercel.app/](https://mritogether-team-finder.vercel.app/)
