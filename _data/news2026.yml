- date: 2026-11-27
  title: Run the launcher once more
  body: |
    If you installed the hackathon environment before 27 November, please run the launcher once more, from the setup page: the new version also opens the port of KomaMRI's browser interface, which day 2 uses. Your work is kept.

    👉 [https://mcencini.github.io/mritogetherthon](https://mcencini.github.io/mritogetherthon)

- date: 2026-11-26
  pinned: true
  title: Your final team
  body: |
    Please use the [MRI TogetherThon Team Finder](https://mritogether-team-finder.vercel.app/) to see your final team lineup and find your teammates' contact details.

    We'll soon send you an invitation to join us on Airmeet and share the resources you'll need for the hackathon.

    We look forward to seeing you at MRI TogetherThon 2026!

- date: 2026-11-24
  pinned: true
  title: Set up the hackathon environment
  body: |
    Every hands-on session runs in one environment on your own computer: JupyterLab with Python and Julia, and all the tools of the week. Please install it before the hackathon starts on 30 November, following the setup page:

    👉 [https://mcencini.github.io/mritogetherthon](https://mcencini.github.io/mritogetherthon)

    You need Docker and about 25 GB of free disk. If you have installed it already, it updates itself the next time you start it.

