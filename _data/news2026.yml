  title: Missing team assignment email
  body: |
    MRI TogetherThon 2026 participants: we've heard that some of you didn't receive your team assignment email, due to technical issues with our email server. We're sorry it didn't reach you.

    If you're missing yours, enter the email address you registered with in our team finder. You'll see your proposed team and instructions for confirming your participation.

